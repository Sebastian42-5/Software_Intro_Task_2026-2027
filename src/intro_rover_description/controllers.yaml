controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_swerve_position_controller:
      type: forward_command_controller/ForwardCommandController

    wheel_velocity_controller:
      type: forward_command_controller/ForwardCommandController

arm_swerve_position_controller:
  ros__parameters:
    joints:
      - shoulder_pitch
      - shoulder_yaw
      - elbow_pitch
      - elbow_roll
      - wrist_pitch
      - wrist_roll
      - fr_swerve_yaw
      - fl_swerve_yaw
      - br_swerve_yaw
      - bl_swerve_yaw
    interface_name: position

wheel_velocity_controller:
  ros__parameters:
    joints:
      - fr_wheel
      - fl_wheel
      - br_wheel
      - bl_wheel
    interface_name: velocity